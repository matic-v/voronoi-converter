<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voronoi Body Generator</title>
    <script type="module" crossorigin src="/assets/index-BlkNKtK5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-pEpoFJCV.css">
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="brand">Voronoi Body Generator</span>
        <button id="btn-load" disabled title="Load an STL model, or a settings .json saved by Export">Load STL</button>
        <input id="file-input" type="file" accept=".stl,.json" hidden />
        <button id="btn-generate" disabled>Generate final</button>
        <button id="btn-export" disabled title="Available after Generate final has produced a valid result">Export</button>
        <button id="btn-reset">Reset settings</button>
        <div id="progress" hidden>
          <div id="progress-track"><div id="progress-bar"></div></div>
          <span id="progress-text"></span>
          <button id="btn-cancel">Cancel</button>
        </div>
        <span class="spacer"></span>
        <span id="backend-status" class="status">Connecting…</span>
      </header>

      <aside id="settings-panel" aria-label="Settings"></aside>

      <main id="viewport">
        <div id="view-buttons" class="overlay">
          <button data-view="front">Front</button>
          <button data-view="top">Top</button>
          <button data-view="side">Side</button>
          <button data-view="iso">Iso</button>
          <button data-view="fit">Fit</button>
        </div>
        <div id="clip-controls" class="overlay">
          <label for="view-mode">Show</label>
          <select id="view-mode" disabled>
            <option value="result">Result</option>
            <option value="original">Original</option>
            <option value="overlay">Overlay</option>
          </select>
          <span class="divider"></span>
          <label for="clip-axis">Clip</label>
          <select id="clip-axis">
            <option value="off">Off</option>
            <option value="x">X</option>
            <option value="y">Y</option>
            <option value="z">Z</option>
          </select>
          <input id="clip-position" type="range" min="0" max="100" step="0.5" value="50" disabled aria-label="Clipping plane position" />
          <label><input id="clip-flip" type="checkbox" disabled /> Flip</label>
          <span class="divider"></span>
          <label title="Colour faces that overhang more than 45° from vertical (build direction Z up)"><input id="overhang" type="checkbox" /> Overhangs</label>
          <label title="Show the edges of the model; click one to have the struts draw it"><input id="show-edges" type="checkbox" checked /> Edges</label>
        </div>
        <div id="viewport-hint" class="overlay">No model loaded · grid = 250 × 250 mm bed, 10 mm squares</div>
        <div id="drop-overlay" hidden>Drop an STL to load it, or a settings .json to apply it</div>
      </main>

      <footer id="info-bar">
        <span id="info-text"></span>
        <span id="result-text"></span>
        <span id="info-warnings"></span>
        <span class="spacer"></span>
        <span id="test-models"></span>
      </footer>

      <section id="error-panel" role="alert" hidden>
        <div id="error-text"></div>
        <button id="error-dismiss" aria-label="Dismiss">Dismiss</button>
      </section>
    </div>
  </body>
</html>
